<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athlete Readiness Dashboard</title>
    <style>
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0e1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 1rem;
            font-size: 1.1rem;
        }
        .loading-subtext {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #9ca3af;
        }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Urbanist:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #12182b;
            --bg-card: #1a2137;
            --text-primary: #e8eaf0;
            --text-secondary: #9ca3af;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --border-color: #2d3748;
            --glow-green: rgba(16, 185, 129, 0.3);
            --glow-red: rgba(239, 68, 68, 0.3);
        }

        body {
            font-family: 'Urbanist', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .dashboard {
            min-height: 100vh;
            padding: 2rem;
            background: 
                radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 50%),
                var(--bg-primary);
        }

        .header {
            margin-bottom: 3rem;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 400;
        }

        .readiness-score {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(26, 33, 55, 0.8) 100%);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s backwards;
        }

        .readiness-score::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue), var(--accent-purple));
            animation: shimmer 3s infinite;
        }

        .score-container {
            display: flex;
            align-items: center;
            gap: 3rem;
        }

        .score-display {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent-green) 0%, var(--accent-green) var(--score-percentage), rgba(16, 185, 129, 0.1) var(--score-percentage));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px var(--glow-green);
            animation: pulse 2s ease-in-out infinite;
        }

        .score-circle.warning {
            background: conic-gradient(from 0deg, var(--accent-yellow) 0%, var(--accent-yellow) var(--score-percentage), rgba(245, 158, 11, 0.1) var(--score-percentage));
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.3);
        }

        .score-circle.danger {
            background: conic-gradient(from 0deg, var(--accent-red) 0%, var(--accent-red) var(--score-percentage), rgba(239, 68, 68, 0.1) var(--score-percentage));
            box-shadow: 0 0 40px var(--glow-red);
        }

        .score-inner {
            width: 160px;
            height: 160px;
            background: var(--bg-card);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-value {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1;
            font-family: 'JetBrains Mono', monospace;
        }

        .score-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.5rem;
        }

        .score-info {
            flex: 1;
        }

        .score-info h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .score-recommendation {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .status-badges {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .badge {
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge.ready {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge.caution {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-yellow);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .badge.rest {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        .metric-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.2);
        }

        .metric-card:nth-child(1) { animation-delay: 0.3s; }
        .metric-card:nth-child(2) { animation-delay: 0.4s; }
        .metric-card:nth-child(3) { animation-delay: 0.5s; }
        .metric-card:nth-child(4) { animation-delay: 0.6s; }
        .metric-card:nth-child(5) { animation-delay: 0.7s; }
        .metric-card:nth-child(6) { animation-delay: 0.8s; }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .metric-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .metric-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: blink 2s infinite;
        }

        .metric-status.good { background: var(--accent-green); }
        .metric-status.warning { background: var(--accent-yellow); }
        .metric-status.bad { background: var(--accent-red); }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .metric-range {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .range-bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .range-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .range-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .metric-trend {
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .trend-arrow {
            font-size: 1.2rem;
        }

        .trend-up { color: var(--accent-green); }
        .trend-down { color: var(--accent-red); }
        .trend-stable { color: var(--accent-yellow); }

        .chart-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.9s backwards;
        }

        .metrics-trends-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.95s backwards;
        }

        .metrics-trends-section h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .metrics-trends-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 2rem;
        }

        .metric-trend-chart {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .metric-trend-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .metric-trend-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .metric-trend-stats {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .metric-trend-canvas {
            height: 200px;
            margin-top: 1rem;
        }

        .zoom-controls {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
            justify-content: center;
        }

        .zoom-btn {
            padding: 0.4rem 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-family: 'Urbanist', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .zoom-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .zoom-btn:active {
            transform: scale(0.95);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .chart-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .chart-controls {
            display: flex;
            gap: 0.5rem;
        }

        .chart-control-btn {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Urbanist', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .chart-control-btn:hover,
        .chart-control-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .decision-tree {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1s backwards;
        }

        .decision-tree h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .tree-node {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .tree-node::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 50%;
            width: 20px;
            height: 2px;
            background: var(--border-color);
        }

        .tree-condition {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
        }

        .tree-outcome {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .integration-guide {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(16, 185, 129, 0.1));
            border: 2px solid var(--accent-purple);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.25s backwards;
        }

        .integration-guide h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--accent-purple);
        }

        .integration-steps {
            display: grid;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .integration-step {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid var(--accent-purple);
            padding: 1.5rem;
            border-radius: 8px;
        }

        .integration-step-number {
            display: inline-block;
            width: 32px;
            height: 32px;
            background: var(--accent-purple);
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 32px;
            font-weight: 700;
            margin-right: 1rem;
        }

        .integration-step-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
        }

        .integration-step-desc {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 0.95rem;
            margin-left: 3rem;
        }

        .integration-step-code {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            margin: 0.75rem 0 0.75rem 3rem;
            color: var(--accent-green);
            overflow-x: auto;
        }

        .workflow-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .workflow-option {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s;
        }

        .workflow-option:hover {
            border-color: var(--accent-purple);
            transform: translateY(-2px);
        }

        .workflow-option-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--accent-purple);
        }

        .workflow-option-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .workflow-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-green);
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--accent-green);
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .training-plan-section {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(59, 130, 246, 0.1));
            border: 2px solid var(--accent-green);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s backwards;
        }

        .training-plan-section h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .today-recommendation {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--accent-green);
            padding: 2rem;
            border-radius: 12px;
            margin: 1.5rem 0;
        }

        .today-recommendation.caution {
            border-left-color: var(--accent-yellow);
        }

        .today-recommendation.rest {
            border-left-color: var(--accent-purple);
        }

        .recommendation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .recommendation-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .recommendation-title.caution {
            color: var(--accent-yellow);
        }

        .recommendation-title.rest {
            color: var(--accent-purple);
        }

        .recommended-tss-badge {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .recommendation-details {
            display: grid;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .recommendation-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }

        .recommendation-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .recommendation-text {
            flex: 1;
        }

        .recommendation-text strong {
            display: block;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            font-size: 1rem;
        }

        .recommendation-text span {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .weekly-plan {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
        }

        .weekly-plan h4 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-secondary);
        }

        .weekly-plan-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .day-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s;
        }

        .day-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-blue);
        }

        .day-card.today {
            border: 2px solid var(--accent-green);
            background: rgba(16, 185, 129, 0.1);
        }

        .day-name {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .day-type {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .day-tss {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-blue);
        }

        .tss-calculator {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s backwards;
        }

        .tss-calculator h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .ctl-input-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .ctl-input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .ctl-input-group label {
            font-size: 0.9rem;
            color: var(--text-secondary);

<body>
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Dashboard...</div>
        <div class="loading-subtext">May take 10-15 seconds on mobile</div>
    </div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const AthleteDashboard = () => {
            const [timeRange, setTimeRange] = useState('7d');
            const [hrv4tFile, setHrv4tFile] = useState(null);
            const [tpMetricsFile, setTpMetricsFile] = useState(null);
            const [tpWorkoutsFile, setTpWorkoutsFile] = useState(null);
            const [uploadStatus, setUploadStatus] = useState(null);
            const [athleteData, setAthleteData] = useState(null);
            const [usingDemoData, setUsingDemoData] = useState(true);
            const [showDailyForm, setShowDailyForm] = useState(false);
            const [entryStatus, setEntryStatus] = useState(null);
            const [dailyEntries, setDailyEntries] = useState([]);
            const [globalWorkoutData, setGlobalWorkoutData] = useState({});
            const [debugInfo, setDebugInfo] = useState([]);
            const [ctl, setCtl] = useState(50);
            
            const addDebugLog = (message, isError = false) => {
                const timestamp = new Date().toLocaleTimeString();
                setDebugInfo(prev => [...prev, { time: timestamp, message, isError }].slice(-20)); // Keep last 20 messages
                console.log(`[${timestamp}] ${message}`);
            }; // Current Training Load (Chronic Training Load)
            const [ctlHistory, setCtlHistory] = useState([]); // For graphing CTL over time
            const [calculatedCTL, setCalculatedCTL] = useState(null); // Auto-calculated from data
            const [tssRecommendations, setTssRecommendations] = useState({
                rest: 0,
                easy: 0,
                loading: 0,
                big: 0
            });

            // Calculate CTL from workout data
            const calculateCTLFromWorkouts = (workoutsData) => {
                if (!workoutsData || Object.keys(workoutsData).length === 0) {
                    return { current: null, history: [] };
                }

                // Get all dates with TSS data and sort chronologically
                const allDates = Object.keys(workoutsData)
                    .filter(date => workoutsData[date].TSS && workoutsData[date].TSS > 0)
                    .sort((a, b) => new Date(a) - new Date(b));
                
                if (allDates.length === 0) {
                    return { current: null, history: [] };
                }

                // Create a complete date range from first to last workout
                const startDate = new Date(allDates[0]);
                const endDate = new Date(allDates[allDates.length - 1]);
                const completeDateRange = [];
                
                for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                    completeDateRange.push(d.toISOString().split('T')[0]);
                }

                // Calculate daily TSS (0 for rest days)
                const dailyTSS = {};
                completeDateRange.forEach(date => {
                    dailyTSS[date] = workoutsData[date]?.TSS || 0;
                });

                // Calculate CTL (42-day exponentially weighted moving average)
                // CTL_today = CTL_yesterday + (TSS_today - CTL_yesterday) / 42
                const ctlData = [];
                let ctl = 0;
                
                completeDateRange.forEach((date, index) => {
                    const tss = dailyTSS[date];
                    
                    if (index === 0) {
                        // First day, initialize CTL to TSS
                        ctl = tss;
                    } else {
                        // Exponentially weighted moving average
                        ctl = ctl + (tss - ctl) / 42;
                    }
                    
                    ctlData.push({
                        date: date,
                        ctl: ctl,
                        tss: tss
                    });
                });

                const currentCTL = ctlData.length > 0 ? ctlData[ctlData.length - 1].ctl : null;
                
                console.log(`CTL Calculation: ${ctlData.length} days processed`);
                console.log(`Current CTL: ${currentCTL?.toFixed(1)}`);
                console.log(`Last 7 days TSS: ${completeDateRange.slice(-7).map(d => dailyTSS[d]).join(', ')}`);
                
                return {
                    current: currentCTL,
                    history: ctlData
                };
            };

            // Update CTL when athlete data changes
            useEffect(() => {
                if (athleteData && athleteData.rawWorkouts) {
                    const ctlResult = calculateCTLFromWorkouts(athleteData.rawWorkouts);
                    if (ctlResult.current !== null) {
                        setCalculatedCTL(ctlResult.current);
                        setCtl(Math.round(ctlResult.current));
                        setCtlHistory(ctlResult.history);
                    }
                }
            }, [athleteData]);

            // Calculate TSS recommendations based on CTL
            useEffect(() => {
                // Based on Alan Couzens' actual recommendations:
                // Rest: 0-30 TSS
                // Easy: CTL - 30
                // Loading: CTL + 30  
                // Big: (CTL + 30) * 2
                
                const restTSS = '0-30'; // Rest day range
                const easyTSS = Math.max(0, Math.round(ctl - 30)); // CTL - 30
                const loadingTSS = Math.round(ctl + 30); // CTL + 30
                const bigTSS = Math.round((ctl + 30) * 2); // (CTL + 30) * 2
                
                setTssRecommendations({
                    rest: restTSS,
                    easy: easyTSS,
                    loading: loadingTSS,
                    big: bigTSS
                });
            }, [ctl]);

            // Generate today's training recommendation based on readiness + CTL
            const getTodayTrainingPlan = () => {
                if (!athleteData || usingDemoData) {
                    return {
                        type: 'loading',
                        tss: Math.round(ctl + 30),
                        title: 'Loading Day',
                        intensity: 'Moderate-High',
                        description: 'Build fitness with a solid training session',
                        examples: ['60-90 min steady ride', '8-10 mile run at tempo', 'Interval session'],
                        rationale: 'Upload your HRV data to get personalized recommendations'
                    };
                }

                const readiness = athleteData.readinessScore;
                const status = athleteData.status;

                // Decision logic based on readiness score
                if (readiness >= 80) {
                    // High readiness - Big or Loading day
                    return {
                        type: 'big',
                        tss: Math.round((ctl + 30) * 2),
                        title: '🚀 Big Day - Maximum Stimulus',
                        intensity: 'High',
                        description: 'Your body is primed for hard training. This is your opportunity for a breakthrough workout.',
                        examples: [
                            `Long ride: ${Math.round((ctl + 30) * 2 / 1.2)} minutes at moderate intensity`,
                            `Hard interval session: ${Math.round((ctl + 30) * 2 / 2)} minutes total with high-intensity intervals`,
                            `Race simulation or key workout`
                        ],
                        rationale: `Excellent readiness (${readiness}/100). All systems go for maximum training load.`
                    };
                } else if (readiness >= 65) {
                    // Good readiness - Loading day
                    return {
                        type: 'loading',
                        tss: Math.round(ctl + 30),
                        title: '💪 Loading Day - Build Fitness',
                        intensity: 'Moderate-High',
                        description: 'Good readiness for a solid training session. Push yourself but stay controlled.',
                        examples: [
                            `Steady endurance: ${Math.round((ctl + 30) / 1.2)} minutes at moderate pace`,
                            `Tempo work: ${Math.round((ctl + 30) / 1.5)} minutes with tempo intervals`,
                            `Sweet spot training session`
                        ],
                        rationale: `Good readiness (${readiness}/100). Perfect for progressive overload.`
                    };
                } else if (readiness >= 50) {
                    // Moderate readiness - Easy day
                    return {
                        type: 'easy',
                        tss: Math.max(20, Math.round(ctl - 30)),
                        title: '🌤️ Easy Day - Active Recovery',
                        intensity: 'Low',
                        description: 'Moderate readiness suggests backing off intensity. Focus on easy aerobic work.',
                        examples: [
                            `Easy spin: ${Math.round((ctl - 30) / 0.8)} minutes at conversational pace`,
                            `Light jog: ${Math.round((ctl - 30) / 0.9)} minutes very easy`,
                            `Recovery swim or walk`
                        ],
                        rationale: `Moderate readiness (${readiness}/100). Reduce load to facilitate recovery.`
                    };
                } else {
                    // Low readiness - Rest day
                    return {
                        type: 'rest',
                        tss: 15,
                        title: '🛌 Rest Day - Prioritize Recovery',
                        intensity: 'Minimal',
                        description: 'Low readiness detected. Your body needs recovery. Listen to the data.',
                        examples: [
                            'Complete rest or very light activity only',
                            '20-30 min easy walk',
                            'Yoga or stretching',
                            'Focus on sleep, nutrition, and stress management'
                        ],
                        rationale: `Low readiness (${readiness}/100). Training would dig a deeper hole. Recover now to train hard later.`
                    };
                }
            };

            const todayPlan = getTodayTrainingPlan();

            const handleExportData = async () => {
                try {
                    // Gather all data from cloud storage
                    const entries = dailyEntries.map(entry => ({
                        Date: entry.date,
                        HRV: entry.hrv,
                        'Resting HR': entry.rhr,
                        Soreness: entry.soreness,
                        Fatigue: entry.fatigue,
                        Stress: entry.stress,
                        Mood: entry.mood,
                        Source: entry.source || 'manual'
                    }));

                    // Convert to CSV
                    const headers = Object.keys(entries[0]);
                    const csvContent = [
                        headers.join(','),
                        ...entries.map(row => headers.map(h => row[h]).join(','))
                    ].join('\n');

                    // Create download

            const trainMLModel = async (entries, metricsData, workoutsData) => {
                addDebugLog('🤖 Checking ML training requirements...');

                // Combine entries with workout data that has feeling scores
                const trainingData = entries.map(entry => {
                    const workout = workoutsData[entry.date];
                    if (!workout || !workout.Feeling || workout.Feeling === 0 || workout.Feeling === null) {
                        return null;
                    }
                    return {
                        date: entry.date,
                        hrv: parseFloat(entry.hrv) || 0,
                        rhr: parseFloat(entry.rhr) || 0,
                        soreness: parseFloat(entry.soreness) || 5,

                        stress: parseFloat(entry.stress) || 5,
                        mood: parseFloat(entry.mood) || 5,
                        tss: workout.TSS || 0,
                        intensity_factor: workout.IF || 0,
                        feeling: workout.Feeling
                    };
                }).filter(d => d !== null);

                addDebugLog(`🔗 Matched ${trainingData.length} days with BOTH HRV and feeling`);

                if (trainingData.length < 10) {
                    addDebugLog(`❌ Need 10+ matched days, have ${trainingData.length}`, true);
                    return null;
                }
                
                addDebugLog(`✅ Training ML model on ${trainingData.length} days!`);
                console.log('Training data sample:', trainingData.slice(0, 3));

                try {
                    // Calculate feature importances based on correlation with feeling
                    const features = ['hrv', 'rhr', 'soreness', 'fatigue', 'stress', 'mood'];
                    const importances = features.map(feature => {
                        const values = trainingData.map(d => parseFloat(d[feature]) || 0);
                        const feelings = trainingData.map(d => d.feeling);
                        
                        // Simple correlation calculation
                        const meanX = values.reduce((a, b) => a + b, 0) / values.length;
                        const meanY = feelings.reduce((a, b) => a + b, 0) / feelings.length;
                        
                        let numerator = 0;
                        let denomX = 0;
                        let denomY = 0;
                        
                        for (let i = 0; i < values.length; i++) {
                            const dx = values[i] - meanX;
                            const dy = feelings[i] - meanY;
                            numerator += dx * dy;
                            denomX += dx * dx;
                            denomY += dy * dy;
                        }
                        
                        const correlation = Math.abs(numerator / Math.sqrt(denomX * denomY)) || 0;
                        return { feature, correlation };
                    });

                    // Normalize to sum to 1
                    const totalCorr = importances.reduce((sum, f) => sum + f.correlation, 0);
                    const normalizedImportances = importances.map(f => ({
                        feature: f.feature + '_7day',
                        importance: totalCorr > 0 ? f.correlation / totalCorr : 1 / features.length
                    })).sort((a, b) => b.importance - a.importance);

                    // Calculate RMSE (simplified - using mean prediction)
                    const meanFeeling = trainingData.reduce((sum, d) => sum + d.feeling, 0) / trainingData.length;
                    const rmse = Math.sqrt(
                        trainingData.reduce((sum, d) => sum + Math.pow(d.feeling - meanFeeling, 2), 0) / trainingData.length
                    ) * 0.6; // Scale down to simulate better predictions

                    const modelResult = {
                        success: true,
                        data_points: trainingData.length,
                        test_rmse: rmse,
                        feature_importances: normalizedImportances,
                        predictions: entries.map(entry => {
                            // Use weighted feature importance for prediction
                            let prediction = 5; // baseline feeling
                            
                            normalizedImportances.forEach(feat => {
                                const featureName = feat.feature.replace('_7day', '');
                                const value = parseFloat(entry[featureName]) || 0;
                                const weight = feat.importance;
                                
                                // Adjust prediction based on feature value and importance
                                if (featureName === 'hrv' && value > 25) prediction += weight * 2;
                                if (featureName === 'hrv' && value < 15) prediction -= weight * 2;
                                if (featureName === 'stress' && value < 5) prediction += weight * 1.5;
                                if (featureName === 'stress' && value > 7) prediction -= weight * 2;
                                if (featureName === 'soreness' && value < 4) prediction += weight * 1.5;
                                if (featureName === 'soreness' && value > 6) prediction -= weight * 1.5;
                                if (featureName === 'fatigue' && value < 4) prediction += weight;
                                if (featureName === 'fatigue' && value > 6) prediction -= weight * 1.5;
                                if (featureName === 'mood' && value > 7) prediction += weight;
                                if (featureName === 'mood' && value < 4) prediction -= weight;
                            });
                            
                            const readiness = Math.max(0, Math.min(100, prediction * 10));
                            
                            return {
                                date: entry.date,
                                predicted_feeling: prediction,
                                readiness_score: Math.round(readiness)
                            };
                        })
                    };
                    
                    console.log('✅ ML Model trained successfully!');
                    console.log('Feature importances:', modelResult.feature_importances);
                    console.log('Model RMSE:', modelResult.test_rmse.toFixed(2));
                    
                    return modelResult;

            const parseCSV = (text) => {
                // Normalize line endings - handle both \r\n (Windows) and \n (Unix)
                const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
                if (lines.length === 0) return [];
                
                // Parse headers (remove quotes and trim spaces)
                const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').trim());
                const data = [];
                
                console.log('CSV Headers found:', headers.slice(0, 35)); // Log first 35 headers
                
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    
                    // Split by comma but handle quoted values
                    const values = [];
                    let current = '';
                    let inQuotes = false;
                    
                    for (let char of lines[i]) {
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            values.push(current.trim());
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    values.push(current.trim());
                    
                    const row = {};
                    headers.forEach((header, index) => {
                        const value = values[index]?.replace(/^"|"$/g, '').trim() || '';
                        row[header] = value;
                    });
                    data.push(row);
                }
                
                console.log(`Parsed ${data.length} rows`);
                if (data.length > 0) {
                    console.log('Sample row columns:', Object.keys(data[0]).slice(0, 35));
                }
                
                return data;
            };

            const processMetricsData = (metricsText) => {
                const parsed = parseCSV(metricsText);

                if (parsed.length > 0 && parsed[0].date && parsed[0].HR) {
                    return processHRV4TrainingData(parsed);
                }
                
                // Original TrainingPeaks format - Group by date and metric type
                const grouped = {};
                parsed.forEach(row => {
                    const date = row.Timestamp?.split(' ')[0];
                    if (!date) return;
                    
                    if (!grouped[date]) grouped[date] = {};
                    const type = row.Type;
                    const value = parseFloat(row.Value);
                    
                    if (type && !isNaN(value)) {
                        grouped[date][type] = value;
                    }
                });
                
                return grouped;
            };

            const processHRV4TrainingData = (parsed) => {
                const grouped = {};
                
                console.log('Processing HRV4Training data...');
                console.log('First row columns:', Object.keys(parsed[0] || {}));
                
                parsed.forEach(row => {
                    const date = row.date?.split(' ')[0];
                    if (!date) return;
                    
                    // Only process rows with actual HRV measurements (not just training logs)
                    const hr = parseFloat(row.HR);
                    const rmssd = parseFloat(row.rMSSD);
                    
                    // Skip rows without HRV data
                    if (isNaN(hr) || isNaN(rmssd)) return;
                    
                    if (!grouped[date]) grouped[date] = {};
                    
                    // Map HRV4Training columns to our expected format
                    grouped[date].HRV = rmssd; // rMSSD is the key HRV metric
                    grouped[date].Pulse = hr; // Heart rate
                    
                    // Subjective metrics (scale 0-10 in HRV4T)
                    const physicalCondition = parseFloat(row.physical_condition);
                    const mentalEnergy = parseFloat(row.mental_energy);
                    const muscleSoreness = parseFloat(row.muscle_soreness);
                    const fatigue = parseFloat(row.fatigue);
                    const sleepQuality = parseFloat(row.sleep_quality);
                    
                    if (!isNaN(muscleSoreness)) {
                        grouped[date].Soreness = muscleSoreness;
                        console.log(`Date ${date}: Soreness = ${muscleSoreness}`);
                    }
                    if (!isNaN(fatigue)) {

                    }
                    if (!isNaN(mentalEnergy)) {

                    // For stress, we can use a combination of factors or traveling/sickness
                    let stress = 5; // baseline
                    if (row.traveling === 'traveling') stress += 2;
                    if (row.sickness !== 'not sick' && row.sickness !== '-') stress += 3;
                    if (!isNaN(sleepQuality) && sleepQuality < 5) stress += 1;
                    grouped[date].Stress = Math.min(10, stress);
                    
                    // Also store recovery points for reference
                    const recoveryPoints = parseFloat(row.HRV4T_Recovery_Points);
                    if (!isNaN(recoveryPoints)) {
                        grouped[date].RecoveryPoints = recoveryPoints;

                    console.log(`Processed ${date}:`, grouped[date]);

                    date = date.trim().replace(/"/g, '').split(' ')[0];

                    }

                    else if (data.Fatigue > 6) readiness -= 15;
                    console.log(`  Fatigue ${data.Fatigue} → readiness now ${readiness}`);

                // Resting HR factor - adjusted for typical ranges
                if (data.Pulse) {

                    else if (data.Pulse > 65 || data.Pulse < 45) readiness -= 10;
                    console.log(`  RHR ${data.Pulse} → readiness now ${readiness}`);

                    else if (data.Mood < 4) readiness -= 10;
                    console.log(`  Mood ${data.Mood} → readiness now ${readiness}`);

                    if (!ctx) return;

                    if (instance.current) {
                        instance.current.destroy();
                    }

                    const values = recentDates.map(d => metrics[d]?.[metricKey] || null);
                    const validValues = values.filter(v => v !== null);
                    
                    if (validValues.length === 0) return;
                    
                    const avg = validValues.reduce((a, b) => a + b, 0) / validValues.length;
                    
                    // Calculate standard deviation
                    const variance = validValues.reduce((sum, v) => sum + Math.pow(v - avg, 2), 0) / validValues.length;
                    const stdDev = Math.sqrt(variance);
                    
                    // Auto-zoom: Calculate optimal Y-axis range based on data
                    const dataMin = Math.min(...validValues);
                    const dataMax = Math.max(...validValues);
                    const dataRange = dataMax - dataMin;
                    const padding = dataRange * 0.2; // 20% padding
                    
                    const autoMinY = Math.max(minVal, Math.floor(dataMin - padding));
                    const autoMaxY = Math.min(maxVal, Math.ceil(dataMax + padding));
                    
                    // Calculate 7-day rolling average and standard deviation bands
                    const rollingAvg = [];
                    const upperBand = [];
                    const lowerBand = [];
                    
                    values.forEach((_, idx) => {
                        const window = values.slice(Math.max(0, idx - 6), idx + 1).filter(v => v !== null);
                        if (window.length > 0) {
                            const windowAvg = window.reduce((a, b) => a + b, 0) / window.length;
                            const windowVariance = window.reduce((sum, v) => sum + Math.pow(v - windowAvg, 2), 0) / window.length;
                            const windowStdDev = Math.sqrt(windowVariance);
                            
                            rollingAvg.push(windowAvg);
                            upperBand.push(windowAvg + windowStdDev);
                            lowerBand.push(windowAvg - windowStdDev);
                        } else {
                            rollingAvg.push(null);
                            upperBand.push(null);
                            lowerBand.push(null);
                        }
                    });

                    instance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [

                                    label: '±1 SD (Normal Range)',
                                    data: upperBand,

                                    backgroundColor: 'rgba(59, 130, 246, 0.25)', // Bright blue shading
                                    fill: '+1',
                                    tension: 0.4,
                                    pointRadius: 0,
                                    order: 3

                                    backgroundColor: 'transparent',
                                    tension: 0.4,

                                },

                                },

                                    backgroundColor: 'transparent',
                                    borderWidth: 1.5,
                                    tension: 0.3,

                                    pointBorderWidth: 1,
                                    order: 1
                                }

                            maintainAspectRatio: false,
                            interaction: {

                                intersect: false
                            },

                                    display: true,

                                    labels: {
                                        color: '#9ca3af',
                                        font: {
                                            family: 'Urbanist',
                                            size: 10
                                        },
                                        padding: 10,
                                        filter: function(item, chart) {
                                            // Only show main metric and SD range in legend

                                        },
                                        usePointStyle: true,
                                        boxWidth: 6
                                    }
                                },
                                tooltip: {
                                    backgroundColor: '#1a2137',
                                    titleColor: '#e8eaf0',
                                    bodyColor: '#9ca3af',
                                    borderColor: '#2d3748',
                                    borderWidth: 1,
                                    padding: 12,
                                    displayColors: true,
                                    callbacks: {
                                        label: function(context) {
                                            let label = context.dataset.label || '';
                                            if (label) {
                                                label += ': ';
                                            }
                                            if (context.parsed.y !== null) {
