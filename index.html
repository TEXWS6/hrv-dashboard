                                        <div className="score-value">{currentData.readinessScore}</div>
                                        <div className="score-label">Score</div>
                                    </div>
                                </div>
                            </div>
                            <div className="score-info">
                                <h2>Today's Assessment</h2>
                                <p className="score-recommendation">{currentData.recommendation}</p>
                                <div className="status-badges">
                                    <div className={`badge ${getStatusClass(currentData.readinessScore)}`}>
                                        <span>●</span>
                                        {currentData.readinessScore >= 70 ? 'Ready to Load' : 
                                         currentData.readinessScore >= 40 ? 'Moderate Caution' : 'Recovery Needed'}
                                    </div>
                                    <div className="badge" style={{background: 'rgba(59, 130, 246, 0.15)', color: 'var(--accent-blue)', border: '1px solid rgba(59, 130, 246, 0.3)'}}>
                                        <span>📊</span>
                                        {usingDemoData ? 'Demo Data' : 'Your Data'}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Today's Training Plan */}
                    <div className={`training-plan-section`}>
                        <h3>📋 Today's Training Recommendation</h3>
                        <p style={{color: 'var(--text-secondary)', fontSize: '0.95rem', marginBottom: '0.5rem'}}>
                            Based on your readiness score and current fitness (CTL)
                        </p>

                        <div className={`today-recommendation ${todayPlan.type === 'rest' ? 'rest' : todayPlan.type === 'easy' ? 'caution' : ''}`}>
                            <div className="recommendation-header">
                                <div className={`recommendation-title ${todayPlan.type === 'rest' ? 'rest' : todayPlan.type === 'easy' ? 'caution' : ''}`}>
                                    {todayPlan.title}
                                </div>
                                <div className="recommended-tss-badge">
                                    {todayPlan.tss} TSS
                                </div>
                            </div>

                            <p style={{color: 'var(--text-secondary)', fontSize: '1rem', lineHeight: '1.6', marginBottom: '1.5rem'}}>
                                {todayPlan.description}
                            </p>

                            <div className="recommendation-details">
                                <div className="recommendation-item">
                                    <div className="recommendation-icon">🎯</div>
                                    <div className="recommendation-text">
                                        <strong>Target Intensity</strong>
                                        <span>{todayPlan.intensity}</span>
                                    </div>
                                </div>

                                <div className="recommendation-item">
                                    <div className="recommendation-icon">💡</div>
                                    <div className="recommendation-text">
                                        <strong>Workout Suggestions</strong>
                                        <span>{todayPlan.examples.map((ex, i) => (
                                            <div key={i} style={{marginTop: i > 0 ? '0.5rem' : '0'}}>• {ex}</div>
                                        ))}</span>
                                    </div>
                                </div>

                                <div className="recommendation-item">
                                    <div className="recommendation-icon">📊</div>
                                    <div className="recommendation-text">
                                        <strong>Why This Recommendation?</strong>
                                        <span>{todayPlan.rationale}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="metrics-grid">
                        {currentData.metrics.map((metric, index) => (
                            <div key={index} className="metric-card">
                                <div className="metric-header">
                                    <div className="metric-title">{metric.name}</div>
                                    <div className={`metric-status ${metric.status}`}></div>
                                </div>
                                <div className="metric-value">
                                    {metric.value}<span style={{fontSize: '1.2rem', color: 'var(--text-secondary)'}}>{metric.unit}</span>
                                </div>
                                <div className="metric-range">
                                    <div className="range-bar">
                                        <div 
                                            className="range-fill" 
                                            style={{width: `${getMetricPercentage(metric)}%`}}
                                        ></div>
                                    </div>
                                    <span className="range-text">{metric.range[0]}-{metric.range[1]}</span>
                                </div>
                                <div className="metric-trend">
                                    <span className={`trend-arrow ${getTrendClass(metric.trend)}`}>
                                        {getTrendIcon(metric.trend)}
                                    </span>
                                    <span>7-day avg vs 60-day baseline ({metric.baseline}{metric.unit})</span>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="tss-calculator">
                        <h3>⚡ Daily TSS Calculator</h3>
                        <p style={{color: 'var(--text-secondary)', marginBottom: '1.5rem', fontSize: '0.95rem'}}>
                            Based on Alan Couzens' CTL-based recommendations. {calculatedCTL !== null ? 
                                'Your CTL is automatically calculated from your workout data.' : 
                                'Enter your current CTL to see recommended TSS for each training day type.'}
                        </p>
                        
                        <div className="ctl-input-section">
                            <div className="ctl-input-group">
                                <label>Current CTL (Chronic Training Load)</label>
                                <input 
                                    type="number" 
                                    value={ctl}
                                    onChange={(e) => setCtl(parseFloat(e.target.value) || 0)}
                                    placeholder="e.g., 50"
                                    disabled={calculatedCTL !== null}
                                    style={calculatedCTL !== null ? {
                                        background: 'rgba(59, 130, 246, 0.1)',
                                        borderColor: 'var(--accent-blue)',
                                        cursor: 'not-allowed'
                                    } : {}}
                                />
                                <span style={{fontSize: '0.8rem', color: 'var(--text-secondary)', marginTop: '0.25rem'}}>
                                    {calculatedCTL !== null ? 
                                        '✓ Auto-calculated from your 42-day rolling average TSS' : 
                                        'Your 42-day rolling average TSS (upload workouts for auto-calculation)'}
                                </span>
                            </div>
                        </div>

                        <div className="tss-recommendations">
                            <div className="tss-category rest">
                                <div className="tss-category-label">Rest Day</div>
                                <div className="tss-category-value">{tssRecommendations.rest}</div>
                                <div className="tss-category-desc">
                                    Low volume recovery
                                </div>
                            </div>

                            <div className="tss-category easy">
                                <div className="tss-category-label">Easy Day</div>
                                <div className="tss-category-value">{tssRecommendations.easy}</div>
                                <div className="tss-category-desc">
                                    CTL - 30 (below baseline)
                                </div>
                            </div>

                            <div className="tss-category loading">
                                <div className="tss-category-label">Loading Day</div>
                                <div className="tss-category-value">{tssRecommendations.loading}</div>
                                <div className="tss-category-desc">
                                    CTL + 30 (fitness stimulus)
                                </div>
                            </div>

                            <div className="tss-category big">
                                <div className="tss-category-label">Big Day</div>
                                <div className="tss-category-value">{tssRecommendations.big}</div>
                                <div className="tss-category-desc">
                                    (CTL + 30) × 2 (max stimulus)
                                </div>
                            </div>
                        </div>

                        <div className="export-section">
                            <div className="export-info">
                                <h4>📥 Export Your Data</h4>
                                <p>Download all your readiness entries as a CSV file for backup or analysis</p>
                            </div>
                            <button className="export-btn" onClick={handleExportData}>
                                Export to CSV
                            </button>
                        </div>
                    </div>

                    <div className="chart-section">
                        <div className="chart-header">
                            <h3 className="chart-title">📈 CTL (Chronic Training Load) - 42-Day Rolling Average</h3>
                            <div className="chart-controls">
                                <button 
                                    className={`chart-control-btn ${timeRange === '7d' ? 'active' : ''}`}
                                    onClick={() => setTimeRange('7d')}
                                >
                                    7 Days
                                </button>
                                <button 
                                    className={`chart-control-btn ${timeRange === '30d' ? 'active' : ''}`}
                                    onClick={() => setTimeRange('30d')}
                                >
                                    30 Days
                                </button>
                                <button 
                                    className={`chart-control-btn ${timeRange === '60d' ? 'active' : ''}`}
                                    onClick={() => setTimeRange('60d')}
                                >
                                    60 Days
                                </button>
                            </div>
                        </div>
                        <div style={{height: '300px', marginBottom: '2rem'}}>
                            <canvas ref={ctlChartRef}></canvas>
                        </div>
                        
                        {calculatedCTL !== null && (
                            <div style={{
                                background: 'rgba(59, 130, 246, 0.1)',
                                border: '1px solid var(--accent-blue)',
                                borderRadius: '12px',
                                padding: '1rem',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'space-between'
                            }}>
                                <div>
                                    <div style={{fontSize: '0.85rem', color: 'var(--text-secondary)', marginBottom: '0.25rem'}}>
                                        Your Current CTL (calculated from workout data)
                                    </div>
                                    <div style={{fontSize: '2rem', fontWeight: '700', color: 'var(--accent-blue)', fontFamily: 'JetBrains Mono'}}>
                                        {Math.round(calculatedCTL)}
                                    </div>
                                </div>
                                <div style={{fontSize: '0.9rem', color: 'var(--text-secondary)'}}>
                                    Based on {ctlHistory.length} days of training data
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="chart-section">
                        <div className="chart-header">
                            <h3 className="chart-title">Readiness & Training Load Trends</h3>
                            <div className="chart-controls">
                                <button 
                                    className={`chart-control-btn ${timeRange === '7d' ? 'active' : ''}`}
                                    onClick={() => setTimeRange('7d')}
                                >
                                    7 Days
                                </button>
                                <button 
                                    className={`chart-control-btn ${timeRange === '30d' ? 'active' : ''}`}
                                    onClick={() => setTimeRange('30d')}
                                >
                                    30 Days
                                </button>
                                <button 
                                    className={`chart-control-btn ${timeRange === '60d' ? 'active' : ''}`}
                                    onClick={() => setTimeRange('60d')}
                                >
                                    60 Days
                                </button>
                            </div>
                        </div>
                        <div style={{height: '400px'}}>
                            <canvas ref={chartRef}></canvas>
                        </div>
                    </div>

                    {/* Individual Metric Trends */}
                    {!usingDemoData && athleteData && athleteData.rawMetrics && Object.keys(athleteData.rawMetrics).length > 0 && (
                        <div className="metrics-trends-section">
                            <h3>📈 Individual Metric Trends</h3>
                            <p style={{color: 'var(--text-secondary)', fontSize: '0.9rem', marginBottom: '1.5rem'}}>
                                Track each readiness factor over time. <strong style={{color: 'rgba(59, 130, 246, 0.9)'}}>Blue shaded area</strong> shows your normal 7-day variability (±1 SD). 
                                Values outside this band indicate unusual highs or lows. Charts auto-zoom to your data range for easy interpretation.
                            </p>
                            
                            <div className="metrics-trends-grid">
                                <div className="metric-trend-chart">
                                    <div className="metric-trend-header">
                                        <div className="metric-trend-title">HRV (rMSSD)</div>
                                        <div className="metric-trend-stats">
                                            <span>Higher = Better</span>
                                        </div>
                                    </div>
                                    <div className="metric-trend-canvas">
                                        <canvas ref={hrvTrendRef}></canvas>
                                    </div>
                                    <div className="zoom-controls">
                                        <button className="zoom-btn" onClick={() => hrvTrendInstance.current?.zoom(1.2)}>🔍 Zoom In</button>
                                        <button className="zoom-btn" onClick={() => hrvTrendInstance.current?.zoom(0.8)}>🔍 Zoom Out</button>
                                        <button className="zoom-btn" onClick={() => hrvTrendInstance.current?.resetZoom()}>↺ Reset</button>
                                    </div>
                                </div>

                                <div className="metric-trend-chart">
                                    <div className="metric-trend-header">
                                        <div className="metric-trend-title">Resting Heart Rate</div>
                                        <div className="metric-trend-stats">
                                            <span>Optimal: 45-60 bpm</span>
                                        </div>
                                    </div>
                                    <div className="metric-trend-canvas">
                                        <canvas ref={rhrTrendRef}></canvas>
                                    </div>
                                    <div className="zoom-controls">
                                        <button className="zoom-btn" onClick={() => rhrTrendInstance.current?.zoom(1.2)}>🔍 Zoom In</button>
                                        <button className="zoom-btn" onClick={() => rhrTrendInstance.current?.zoom(0.8)}>🔍 Zoom Out</button>
                                        <button className="zoom-btn" onClick={() => rhrTrendInstance.current?.resetZoom()}>↺ Reset</button>
                                    </div>
                                </div>

                                <div className="metric-trend-chart">
                                    <div className="metric-trend-header">
                                        <div className="metric-trend-title">Soreness</div>
                                        <div className="metric-trend-stats">
                                            <span>Lower = Better</span>
                                        </div>
                                    </div>
                                    <div className="metric-trend-canvas">
                                        <canvas ref={sorenessTrendRef}></canvas>
                                    </div>
                                    <div className="zoom-controls">
                                        <button className="zoom-btn" onClick={() => sorenessTrendInstance.current?.zoom(1.2)}>🔍 Zoom In</button>
                                        <button className="zoom-btn" onClick={() => sorenessTrendInstance.current?.zoom(0.8)}>🔍 Zoom Out</button>
                                        <button className="zoom-btn" onClick={() => sorenessTrendInstance.current?.resetZoom()}>↺ Reset</button>
                                    </div>
                                </div>

                                <div className="metric-trend-chart">
                                    <div className="metric-trend-header">
                                        <div className="metric-trend-title">Fatigue</div>
                                        <div className="metric-trend-stats">
                                            <span>Lower = Better</span>
                                        </div>
                                    </div>
                                    <div className="metric-trend-canvas">
                                        <canvas ref={fatigueTrendRef}></canvas>
                                    </div>
                                    <div className="zoom-controls">
                                        <button className="zoom-btn" onClick={() => fatigueTrendInstance.current?.zoom(1.2)}>🔍 Zoom In</button>
                                        <button className="zoom-btn" onClick={() => fatigueTrendInstance.current?.zoom(0.8)}>🔍 Zoom Out</button>
                                        <button className="zoom-btn" onClick={() => fatigueTrendInstance.current?.resetZoom()}>↺ Reset</button>
                                    </div>
                                </div>

                                <div className="metric-trend-chart">
                                    <div className="metric-trend-header">
                                        <div className="metric-trend-title">Stress</div>
                                        <div className="metric-trend-stats">
                                            <span>Lower = Better</span>
                                        </div>
                                    </div>
                                    <div className="metric-trend-canvas">
                                        <canvas ref={stressTrendRef}></canvas>
                                    </div>
                                    <div className="zoom-controls">
                                        <button className="zoom-btn" onClick={() => stressTrendInstance.current?.zoom(1.2)}>🔍 Zoom In</button>
                                        <button className="zoom-btn" onClick={() => stressTrendInstance.current?.zoom(0.8)}>🔍 Zoom Out</button>
                                        <button className="zoom-btn" onClick={() => stressTrendInstance.current?.resetZoom()}>↺ Reset</button>
                                    </div>
                                </div>

                                <div className="metric-trend-chart">
                                    <div className="metric-trend-header">
                                        <div className="metric-trend-title">Mood / Mental Energy</div>
                                        <div className="metric-trend-stats">
                                            <span>Higher = Better</span>
                                        </div>
                                    </div>
                                    <div className="metric-trend-canvas">
                                        <canvas ref={moodTrendRef}></canvas>
                                    </div>
                                    <div className="zoom-controls">
                                        <button className="zoom-btn" onClick={() => moodTrendInstance.current?.zoom(1.2)}>🔍 Zoom In</button>
                                        <button className="zoom-btn" onClick={() => moodTrendInstance.current?.zoom(0.8)}>🔍 Zoom Out</button>
                                        <button className="zoom-btn" onClick={() => moodTrendInstance.current?.resetZoom()}>↺ Reset</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="decision-tree">
                        <div style={{
                            display: 'flex',
                            justifyContent: 'space-between',
                            alignItems: 'center',
                            marginBottom: '1rem'
                        }}>
                            <h3>🤖 Machine Learning Model - Key Readiness Factors</h3>
                            
                            {currentData.mlModel && currentData.mlModel.success ? (
                                <div style={{
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '0.5rem',
                                    padding: '0.75rem 1.5rem',
                                    background: 'linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(16, 185, 129, 0.2))',
                                    border: '2px solid var(--accent-purple)',
                                    borderRadius: '12px',
                                    fontSize: '1rem',
                                    fontWeight: '700',
                                    animation: 'pulse 2s infinite'
                                }}>
                                    <span style={{fontSize: '1.5rem'}}>✅</span>
                                    <div>
                                        <div style={{color: 'var(--accent-green)', fontSize: '0.9rem'}}>
                                            ML Model Active
                                        </div>
                                        <div style={{color: 'var(--text-secondary)', fontSize: '0.75rem', fontWeight: '500'}}>
                                            Personalized predictions enabled
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div style={{
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '0.5rem',
                                    padding: '0.75rem 1.5rem',
                                    background: 'rgba(245, 158, 11, 0.15)',
                                    border: '2px solid var(--accent-yellow)',
                                    borderRadius: '12px',
                                    fontSize: '1rem',
                                    fontWeight: '700'
                                }}>
                                    <span style={{fontSize: '1.5rem'}}>📐</span>
                                    <div>
                                        <div style={{color: 'var(--accent-yellow)', fontSize: '0.9rem'}}>
                                            Rule-Based Mode
                                        </div>
                                        <div style={{color: 'var(--text-secondary)', fontSize: '0.75rem', fontWeight: '500'}}>
                                            Using standard thresholds
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                        
                        {currentData.mlModel && currentData.mlModel.success ? (
                            <>
                                <div style={{
                                    background: 'rgba(139, 92, 246, 0.1)',
                                    border: '1px solid var(--accent-purple)',
                                    borderRadius: '12px',
                                    padding: '1.5rem',
                                    marginBottom: '1.5rem'
                                }}>
                                    <div style={{fontSize: '0.95rem', color: 'var(--text-secondary)', marginBottom: '1rem'}}>
                                        <strong style={{color: 'var(--accent-purple)'}}>🎯 Your readiness score is now powered by machine learning!</strong>
                                        <br/><br/>
                                        The model has been trained on <strong>{currentData.mlModel.data_points} days</strong> of your personal data
                                        and achieved an accuracy of <strong>RMSE: {currentData.mlModel.test_rmse?.toFixed(2)}</strong>.
                                        <br/><br/>
                                        This means predictions are personalized to YOUR physiology and patterns, not generic thresholds.
                                    </div>
                                </div>
                                
                                <h4 style={{fontSize: '1rem', marginBottom: '1rem', color: 'var(--accent-blue)'}}>
                                    Feature Importance (What Matters Most for YOU):
                                </h4>
                                
                                {currentData.mlModel.feature_importances.map((feat, idx) => (
                                    <div key={idx} className="tree-node">
                                        <div className="tree-condition">
                                            {feat.feature.replace('_7day', ' (7-day avg)').replace('_', ' ').toUpperCase()}
                                        </div>
                                        <div className="tree-outcome">
                                            Importance: {(feat.importance * 100).toFixed(1)}% 
                                            {idx === 0 && ' 👑 (Most predictive for you)'}
                                        </div>
                                    </div>
                                ))}
                                
                                <p style={{marginTop: '1.5rem', color: 'var(--text-secondary)', fontSize: '0.9rem', fontStyle: 'italic'}}>
                                    💡 The model learns which specific metrics predict how YOU feel during workouts.
                                    As you add more data (especially workout feeling scores), predictions become even more accurate.
                                </p>
                            </>
                        ) : (
                            <>
                                <p style={{color: 'var(--text-secondary)', marginBottom: '1.5rem', fontSize: '0.95rem'}}>
                                    Currently using rule-based readiness calculation with standard thresholds. Upload your HRV4Training history 
                                    with <strong>workout feeling scores</strong> to enable personalized ML predictions.
                                </p>
                                
                                <div className="tree-node">
                                    <div className="tree-condition">Current Algorithm: Rule-Based</div>
                                    <div className="tree-outcome">
                                        Combines HRV, RHR, Soreness, Fatigue, Stress, and Mood using standard thresholds.
                                        Works well but not personalized to your individual physiology.
                                    </div>
                                </div>
                                
                                <div className="tree-node" style={{
                                    background: 'rgba(245, 158, 11, 0.1)',
                                    borderLeft: '4px solid var(--accent-yellow)'
                                }}>
                                    <div className="tree-condition">🎯 To Enable ML Model (Personalized Predictions):</div>
                                    <div className="tree-outcome">
                                        1. In HRV4Training or TrainingPeaks: Rate how you FEEL during/after workouts (1-10 scale)<br/>
                                        2. Export your data with at least 10 workouts that have feeling scores<br/>
                                        3. Upload CSV to dashboard<br/>
                                        4. Model trains automatically on YOUR data and learns YOUR patterns<br/>
                                        5. Future predictions become highly accurate and personalized
                                    </div>
                                </div>
                            </>
                        )}
                    </div>

                    <div className="footer">
                        <p>Based on "Dashboard Insights - Gauging Athlete Readiness for Peak Performance" by Alan Couzens</p>
                        <p style={{marginTop: '0.5rem', fontSize: '0.8rem'}}>
                            Individual readiness model • Recovery on demand • Dynamic loading
                        </p>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<AthleteDashboard />, document.getElementById('root'));
        
        // Hide loading screen after React renders
        setTimeout(() => {
            const loading = document.getElementById('loading-screen');
            if (loading) {
                loading.style.opacity = '0';
                loading.style.transition = 'opacity 0.5s';
                setTimeout(() => loading.remove(), 500);
            }
        }, 100);
    </script>
</body>
</html>
